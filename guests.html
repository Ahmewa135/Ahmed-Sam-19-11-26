<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مولّد روابط الضيوف</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6efe0;color:#3b2a22;font:18px/1.7 'Amiri',serif;padding:20px;max-width:560px;margin:auto}h1{color:#6b1626;font-size:1.6rem}label{display:block;margin-top:14px;font-weight:700}textarea,input{width:100%;font:inherit;padding:10px;border:1px solid #c9a45c;border-radius:8px;background:#fffaf0}.b{font:inherit;background:#6b1626;color:#fff;border:0;border-radius:24px;padding:8px 18px;margin:6px 4px 0 0;cursor:pointer}.o{background:transparent;color:#6b1626;border:1px solid #6b1626}.r{background:#fffaf0;border:1px solid #c9a45c;border-radius:8px;padding:10px 12px;margin-top:12px;word-break:break-all}small{color:#8a6f5a;display:block}</style></head><body>
<h1>مولّد روابط الضيوف ♥</h1>
<label>رابط الدعوة بعد النشر<input id="u" dir="ltr" value="https://ahmewa135.github.io/Ahmed-Sam-19-11-26/" placeholder="https://اسم-حسابك.github.io/اسم-المستودع/"></label>
<label>أسماء الضيوف (اسم في كل سطر)<textarea id="n" rows="6" placeholder="عمو محمود&#10;طنط سناء"></textarea></label>
<button class="b" id="g">إنشاء الروابط</button><div id="o"></div>
<script>
const $=s=>document.querySelector(s);
try{$("#n").value=localStorage.getItem("gn")||""}catch(e){}
$("#g").onclick=()=>{try{localStorage.setItem("gn",$("#n").value)}catch(e){}const base=$("#u").value.trim(),o=$("#o");o.innerHTML="";
 if(!/^https?:\/\//.test(base)){o.textContent="اكتب رابط الدعوة أولًا (يبدأ بـ https://)";return}
 $("#n").value.split("\n").map(x=>x.trim()).filter(Boolean).forEach(n=>{
  const link=base+(base.includes("?")?"&":"?")+"name="+encodeURIComponent(n),
  msg="♥ دعوة خطوبة أحمد وسام ♥\nدعوة خاصة لـ "+n+"\n"+link,d=document.createElement("div");d.className="r";
  d.innerHTML="<b></b><small dir=ltr></small>";d.firstChild.textContent=n;d.lastChild.textContent=link;
  const c=document.createElement("button");c.className="b o";c.textContent="نسخ الرابط";c.onclick=async()=>{try{await navigator.clipboard.writeText(link);c.textContent="تم النسخ ✓"}catch(e){prompt("انسخ الرابط",link)}};
  const w=document.createElement("button");w.className="b";w.textContent="الدعوة عبر واتساب";w.onclick=()=>window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank","noopener");
  const tm="♥ شكرًا يا "+n+" ♥\nنورتنا في خطوبة أحمد وسام، وفرحتنا كملت بوجودك.\nصور ولقطات الليلة هنا:\n"+link,
  t=document.createElement("button");t.className="b o";t.textContent="رسالة شكر عبر واتساب";t.onclick=()=>window.open("https://wa.me/?text="+encodeURIComponent(tm),"_blank","noopener");
  const rmsg="♥ تذكير بدعوة خطوبة أحمد وسام ♥\nيا "+n+"، منتظرين حضورك يوم الخميس 19 نوفمبر الساعة 7 مساءً في قاعة الواحة.\nالتفاصيل والموقع:\n"+link,
  r=document.createElement("button");r.className="b o";r.textContent="تذكير عبر واتساب";r.onclick=()=>window.open("https://wa.me/?text="+encodeURIComponent(rmsg),"_blank","noopener");
  d.append(c,w,r,t);o.appendChild(d)})};
</script></body></html>
