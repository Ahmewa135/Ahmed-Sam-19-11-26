<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--n:#26080f;--b:#6b1626;--c:#f6efe0;--m:#d9c8b0;--g:#c9a45c;--r:#d9a3a8;--ar:'Amiri','Noto Naskh Arabic',serif;--d:'Aref Ruqaa','Amiri',serif;--en:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--n);color:var(--c);font:20px/1.9 var(--ar);overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
html[lang=en] body{font:21px/1.6 var(--en)}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;animation:tw 5s infinite alternate;background:radial-gradient(1.5px 1.5px at 12% 18%,#fff9,transparent),radial-gradient(1px 1px at 78% 12%,#fff8,transparent),radial-gradient(1.5px 1.5px at 40% 60%,#fff7,transparent),radial-gradient(1px 1px at 88% 70%,#fff8,transparent),radial-gradient(1px 1px at 22% 88%,#fff7,transparent)}
@keyframes tw{to{opacity:.25}}
section{position:relative;z-index:1;padding:56px 22px;max-width:620px;margin:auto;text-align:center}
h2{font:700 2.2rem/1.3 var(--d);color:var(--g);margin-bottom:6px}
html[lang=en] h2{font:italic 600 2.5rem var(--en)}
.sub{color:var(--m);margin-bottom:26px}
.btn{font:inherit;font-size:1.05rem;border:1.5px solid var(--g);background:var(--g);color:var(--n);padding:10px 24px;border-radius:30px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-block;transition:.25s;font-weight:700}
.btn:hover{transform:translateY(-2px)}.btn.o{background:transparent;color:var(--g)}
:focus-visible{outline:3px solid var(--r);outline-offset:3px}
[hidden]{display:none!important}
.arch{border-radius:999px 999px 8px 8px;overflow:hidden;border:1px solid var(--g);padding:7px;background:#ffffff10}
.arch img{width:100%;height:100%;display:block;object-fit:cover;border-radius:999px 999px 4px 4px}
/* envelope */
#env{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 30%,#3a0f1a,#16040a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:transform 1.2s cubic-bezier(.7,0,.3,1),opacity .4s .9s}
#env.go{transform:translateY(-100%);opacity:0;pointer-events:none}
.ev{position:relative;width:min(86vw,360px);aspect-ratio:1.45;perspective:800px}
.ev>*{position:absolute}
.lt{left:7%;right:7%;top:8%;bottom:8%;background:#fffaf0;display:flex;align-items:center;justify-content:center;font:italic 600 1.7rem var(--en);color:var(--b);transition:transform 1s .5s;z-index:1}
.fr{inset:0;background:#ead9b6;clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);z-index:2;filter:drop-shadow(0 0 1px #0004)}
.bk{inset:0;background:#d8c49a;z-index:0;box-shadow:0 20px 50px #000a}
.fl{left:0;right:0;top:0;height:56%;background:#e4d3b0;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s;z-index:3}
.seal{left:50%;top:54%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:0;z-index:4;cursor:pointer;color:#f3d9a5;font:italic 600 1.5rem var(--en);background:radial-gradient(circle at 35% 30%,#b0314a,#6b1626 70%);box-shadow:0 4px 12px #0008,inset 0 0 0 4px #7d1d2f,inset 0 0 0 6px #d9a3a855;animation:pu 4s ease-in-out infinite}
@keyframes pu{50%{box-shadow:0 0 0 16px #c9a45c14,inset 0 0 0 4px #7d1d2f}}
#env.open .fl{transform:rotateX(180deg)}#env.open .lt{transform:translateY(-34%)}
#env.open .seal{transform:translate(-50%,-50%) scale(0);opacity:0;transition:.5s;animation:none}
#env p{color:var(--m);font-size:1.05rem}#eg{font:700 1.3rem var(--d);color:var(--g)}
#eg:empty{display:none}
/* hero */
#hero{max-width:none;padding:0 22px 44px;min-height:100svh;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
#himg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;transform:scale(1.08);filter:blur(14px) sepia(.9) brightness(1.3);transition:filter 4s .6s}
body.open #himg{filter:none}
#hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--n) 2%,#26080fb3 24%,transparent 50%)}
.hc{position:relative;z-index:2}
.moon{position:absolute;z-index:2;top:max(64px,calc(env(safe-area-inset-top) + 56px));inset-inline-end:26px;width:46px;filter:drop-shadow(0 0 14px #f6efe0aa)}
.nm{font:italic 600 clamp(2.5rem,12.5vw,3.7rem)/.95 var(--en);direction:ltr;text-shadow:0 2px 20px #000a}
.nm em{display:block;font-size:.45em;color:var(--g)}
.an{font:700 1.5rem var(--d);color:var(--g);margin-top:4px}
.vs{font:1.25rem/1.6 var(--d);margin:6px 0 10px}
.dt{display:inline-block;border-top:1px solid var(--g);border-bottom:1px solid var(--g);padding:2px 18px;font:600 1.2rem var(--en);letter-spacing:.2em;color:var(--m);direction:ltr}
#guest{font:700 1.2rem var(--d);color:var(--r)}#guest:empty{display:none}
.a{animation:in 1.8s calc(var(--i)*.6s + .8s) both}
.iv{color:var(--m);font-size:1.05rem;margin-bottom:6px}
.hb{position:absolute;inset:0;animation:kb 26s ease-in-out infinite alternate}@keyframes kb{to{transform:scale(1.07)}}
.cue{display:block;width:1px;height:34px;margin:14px auto 0;background:linear-gradient(var(--g),transparent);animation:cue 2.8s ease-in-out infinite;transform-origin:top}@keyframes cue{50%{transform:scaleY(.4);opacity:.4}}
.du{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--g);opacity:0;z-index:2;animation:up 14s linear infinite}@keyframes up{10%{opacity:.6}to{transform:translateY(-100vh) translateX(24px);opacity:0}}
body:not(.open) .a{animation-play-state:paused}
@keyframes in{from{opacity:0;filter:blur(6px);transform:translateY(12px)}}
#env>*{animation:in 1.8s .3s both}
/* story */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0 20px;align-items:start}
.pair figure:nth-child(2){margin-top:34px}
.pair .arch{aspect-ratio:3/4}
figcaption{margin-top:6px;font:italic 1.15rem var(--en);color:var(--m)}
.hug{width:78%;margin:0 auto;aspect-ratio:3/4}
.quote{font:1.5rem/1.8 var(--d);color:var(--r);margin:26px 0 8px}
/* timeline */
.tlw{position:relative;max-width:420px;margin:30px auto 0;text-align:start}
.tlw::before,#fill{content:"";position:absolute;top:6px;inset-inline-start:11px;width:2px}
.tlw::before{bottom:6px;background:#ffffff26}
#fill{background:linear-gradient(var(--g),var(--r));height:0}
.tl{list-style:none;padding:0}
.tl li{position:relative;padding-inline-start:48px;margin-bottom:30px}
.tl li::before{content:"♥";position:absolute;inset-inline-start:0;top:2px;width:24px;text-align:center;background:var(--n);color:#ffffff40;transition:.6s;line-height:1.3}
.tl li.on::before{color:var(--r);text-shadow:0 0 12px var(--r)}
.tl b{display:block;font:700 1.35rem var(--d);color:var(--g)}.tl span{color:var(--m)}
/* countdown */
.cal{background:var(--c);color:#3b2a22;padding:16px 12px;box-shadow:0 10px 30px #0008;transform:rotate(-1deg);direction:ltr;border-top:8px solid var(--b)}
.cal h3{font:italic 600 1.8rem var(--en);color:var(--b)}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;font:1.05rem var(--en)}
.cal .g i{font-style:normal;color:#8a6f5a;font-size:.8rem;font-family:var(--ar)}
.cal .g span{height:38px;display:flex;align-items:center;justify-content:center;position:relative}
.cal .x{color:#b9a}.cal .x::after{content:"";position:absolute;width:70%;height:2px;background:var(--r);transform:rotate(-35deg)}
.cal .t{color:var(--b);font-weight:700}.cal .t svg{position:absolute;width:46px;height:42px;overflow:visible}
.draw path{stroke-dasharray:1;stroke-dashoffset:1;fill:none;stroke:var(--b);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke-dashoffset 2.4s ease}
.rv.in .draw path{stroke-dashoffset:0}
.hand{font:700 1.6rem var(--d);color:var(--g);margin-top:18px}
.note{color:var(--m);font-size:.95rem}
/* gallery */
.deck{position:relative;width:min(68vw,270px);aspect-ratio:3/4.1;margin:22px auto 0;touch-action:pan-y;cursor:pointer}
.dc{position:absolute;inset:0;background:#fffaf0;padding:9px 9px 34px;box-shadow:0 10px 26px #000a;transition:transform .8s cubic-bezier(.3,.8,.3,1),opacity .5s;user-select:none}
.dc img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block;pointer-events:none}
.dc::after{content:"♥";position:absolute;bottom:6px;left:0;right:0;color:var(--b);font-size:.9rem}
.dk{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:46px;color:var(--m);font-family:var(--en)}
.car{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 14vw 20px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car button{flex:none;width:68vw;max-width:280px;aspect-ratio:3/4;scroll-snap-align:center;cursor:pointer;color:inherit;transition:transform .3s}
.car button:nth-child(odd){transform:rotate(-1.5deg)}.car button:nth-child(even){transform:rotate(1.5deg) translateY(14px)}
.car img{object-position:50% 28%}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:82vh;border:8px solid var(--c)}
#lb .btn{position:absolute;top:max(14px,env(safe-area-inset-top));inset-inline-end:14px;padding:6px 18px}
/* ticket */
.tk{background:var(--c);color:#3b2a22;position:relative;padding:28px 20px;text-align:start;box-shadow:0 14px 34px #000a;border-radius:6px}
.tk::before,.tk::after{content:"";position:absolute;top:96px;width:26px;height:26px;border-radius:50%;background:var(--n)}
.tk::before{inset-inline-start:-13px}.tk::after{inset-inline-end:-13px}
.tk .top{display:flex;align-items:center;gap:16px;padding-bottom:26px;border-bottom:2px dashed #b9a58a;margin-bottom:14px}
.tk .day{font:italic 600 4.2rem/1 var(--en);color:var(--b)}
.tk .mo{font:700 1.4rem var(--d);color:var(--b)}
.tk dt{color:#8a6f5a;font-size:.95rem;margin-top:10px}.tk dd{font-size:1.25rem;font-weight:700;color:var(--b)}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.wish{margin-top:44px}
.wish textarea{width:100%;background:#ffffff14;border:1px solid var(--g);border-radius:8px;color:var(--c);font:inherit;padding:10px 14px;resize:none;margin:10px 0}
.inv{background:var(--c);color:#3b2a22;padding:58px 34px 28px;border-radius:230px 230px 10px 10px;position:relative;box-shadow:0 16px 40px #000a}
.inv::before{content:"";position:absolute;inset:9px;border:1px solid var(--g);border-radius:222px 222px 6px 6px;pointer-events:none}
.ml{font:italic 600 2.2rem var(--en);color:var(--b);direction:ltr}.il{color:#8a6f5a}
.cn2{font:700 1.9rem/1.3 var(--d);color:var(--b)}
.dtr{display:flex;align-items:center;justify-content:center;gap:16px;border-block:1px solid var(--g);margin:16px 6px;padding:6px 0}
.dtr b{font:italic 600 3.4rem/1 var(--en);color:var(--b)}.dtr span{font:700 1.15rem var(--d);color:var(--b)}
.inv .k{color:#8a6f5a;font-size:.9rem;margin-top:8px}.inv .v{font-size:1.25rem;font-weight:700;color:var(--b);line-height:1.6}
.mp{margin:18px 4px 14px;height:190px;border-radius:10px;overflow:hidden;border:1px solid var(--g);background:#e9dcc3}
.mp iframe{width:100%;height:100%;border:0;filter:sepia(.3)}
.inv .btn{background:var(--b);color:var(--c);border-color:var(--b)}
.btn.cta{display:block;width:100%;font-size:1.3rem;padding:14px;margin-top:24px;box-shadow:0 0 28px #c9a45c44}
.acts2{margin-top:14px}.acts2 .btn{font-size:.9rem;padding:4px 14px;min-height:38px}
.mb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.inv .btn.o{background:transparent;color:var(--b)}
.cdb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 22px;direction:ltr}
.cdb div{background:#ffffff10;border:1px solid var(--g);border-radius:10px;padding:10px 2px}
.cdb b{display:block;font:600 2.3rem/1 var(--en);color:var(--g)}.cdb small{color:var(--m);font-size:.85rem}
.hand:empty{display:none}.nt{margin-top:12px;color:#8a6f5a}
#sb{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;display:flex;justify-content:center;z-index:30;pointer-events:none}
#sb .btn{pointer-events:auto;box-shadow:0 6px 24px #000a;padding:10px 34px}
#rp{background:#ffffff10;border:1px solid var(--g);border-radius:12px;padding:16px;margin-top:14px}
#rp input{width:100%;background:#ffffff14;border:1px solid var(--g);border-radius:8px;color:var(--c);font:inherit;padding:8px 12px;margin:4px 0 8px}
.rl{color:var(--m);font-size:.95rem}.st{display:flex;align-items:center;justify-content:center;gap:22px;margin:6px 0 14px}
.st button{width:44px;height:44px;border-radius:50%;border:1px solid var(--g);background:transparent;color:var(--g);font-size:1.5rem;cursor:pointer}
.st b{font:600 2rem var(--en);color:var(--g);min-width:34px}
/* finale */
#fin{max-width:none;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;overflow:hidden;padding-bottom:70px}
#fin>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:57% 22%}
#fin::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--n) 6%,#26080fcc 40%,#26080f44)}
#fin .hc{z-index:3}.big{font:1.9rem/1.5 var(--d);color:var(--g)}
.pt{position:absolute;top:-30px;color:var(--r);opacity:.7;z-index:2;animation:fall 9s linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(200deg)}}
.bar{position:fixed;top:calc(env(safe-area-inset-top) + 10px);inset-inline-start:10px;display:flex;gap:8px;z-index:20}
.bar button{background:#26080fcc;border:1px solid var(--g);color:var(--g);border-radius:20px;padding:4px 14px;font:inherit;font-size:.95rem;cursor:pointer;min-height:40px;backdrop-filter:blur(6px)}
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 20px);left:50%;transform:translateX(-50%);background:var(--c);color:var(--n);padding:10px 20px;border-radius:24px;font-size:.95rem;opacity:0;pointer-events:none;transition:.3s;z-index:120;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.rv{opacity:0;transform:translateY(24px);transition:opacity .9s,transform .9s}.rv.in{opacity:1;transform:none}
.wish input{width:100%;background:#ffffff14;border:1px solid var(--g);border-radius:8px;color:var(--c);font:inherit;padding:8px 14px;margin-top:10px}
#bk{display:grid;gap:12px;margin-top:14px;text-align:start}.bw{background:#ffffff10;border:1px solid #c9a45c66;border-radius:12px;padding:12px 16px}.bw p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.bw b{display:block;margin-top:4px;color:var(--g);font-weight:700;font-size:.95rem}
.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 18px}.ag i{aspect-ratio:3/4;border:1.5px dashed #c9a45c88;border-radius:999px 999px 8px 8px;display:flex;align-items:center;justify-content:center;color:#c9a45c66;font-style:normal}
#alb .acts{margin-top:14px}
#rok{display:none;font:700 1.3rem var(--d);color:var(--g)}#rp.ok #rok{display:block}#rp.ok input,#rp.ok #rg,#rp.ok h2{display:none}body[data-ph=after] #rp{display:none}
#rp.ok .yn,#rp.ok .cw{display:none}#rp.no .cw{display:none}#rok p{margin:0 0 10px}
.yn{display:flex;gap:10px;justify-content:center;margin:6px 0 12px}.yn .btn{padding:6px 18px;font-size:1rem;min-height:42px}
.yn .btn[aria-pressed=true]{background:var(--g);color:var(--n)}.yn .btn[aria-pressed=false]{background:transparent;color:var(--g)}
#msg{position:fixed;inset:0;z-index:110;background:#16040acc;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:22px}
#msg.on{display:flex}
.mc{background:var(--c);color:#3b2a22;max-width:400px;width:100%;padding:64px 30px 26px;border-radius:200px 200px 14px 14px;text-align:center;position:relative;box-shadow:0 20px 60px #000c;animation:pop .9s cubic-bezier(.2,.9,.3,1) both}
.mc::before{content:"";position:absolute;inset:9px;border:1px solid var(--g);border-radius:192px 192px 8px 8px;pointer-events:none}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.94)}}
.mh{font-size:2rem;color:var(--b);line-height:1;animation:pu2 2.4s ease-in-out infinite}@keyframes pu2{50%{transform:scale(1.18)}}
.mt{font:700 1.8rem/1.4 var(--d);color:var(--b);margin:6px 0 4px}
html[lang=en] .mt{font:italic 600 2.1rem/1.2 var(--en)}
.mp2{font-size:1.1rem;line-height:1.8;color:#3b2a22;margin-bottom:6px}
.mc .btn{background:var(--b);color:var(--c);border-color:var(--b);display:block;width:100%;margin-top:12px}
.mc .btn.o{background:transparent;color:var(--b)}
/* phases */
#ph{padding-bottom:10px}
#ph .box{border:1px solid var(--g);border-radius:18px;padding:26px 18px;background:radial-gradient(circle at 50% 0,#c9a45c26,#ffffff0d);box-shadow:0 0 40px #c9a45c22}
#ph h2{font-size:2rem}#ph p.pp{color:var(--m);margin:6px 0 4px}
#ph .acts{margin-top:16px}#ph .btn.o{background:transparent}
body[data-ph=after] #count,body[data-ph=after] .inv,body[data-ph=after] .acts2,body[data-ph=after] #info h2[data-t=infoH]{display:none}
body[data-ph=live] #count{display:none}
@media(prefers-reduced-motion:reduce){*,*::before{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}.pt,.du{display:none}}
</style>
</head>
<body class="lock">
<div class="bar"><button id="lang">English</button><button id="mus" aria-pressed="false">♪ <span data-t="musOn"></span></button></div>
<audio id="aud" loop preload="none"></audio>

<div id="env"><p id="eg"></p>
 <div class="ev"><i class="bk"></i><div class="lt">A &amp; S</div><i class="fr"></i><i class="fl"></i><button class="seal" id="seal" aria-label="Open">A&amp;S</button></div>
 <p data-t="seal"></p></div>

<section id="hero">
 <div class="hb"><img id="himg" alt="Ahmed &amp; Sam"></div>
 <div class="hc">
  <p id="guest" class="a" style="--i:0"></p>
  <p class="iv a" style="--i:1" data-t="inv"></p>
  <h1 class="nm a" style="--i:2">Ahmed<em>&amp;</em>Sam</h1>
  <p class="an a" style="--i:3" data-t="names"></p>
  <p class="vs a" style="--i:4" data-t="verse"></p>
  <span class="dt a" style="--i:5">19 · 11 · 2026</span>
  <div class="a" style="--i:6"><i class="cue"></i></div>
 </div>
</section>

<section id="ph" hidden><div class="rv"><div class="box"><h2 id="phH"></h2><p class="pp" id="phP"></p><div class="acts" id="phA"></div></div></div></section>
